from flask import Flask, render_template, request, redirect, url_for, jsonify
from flask_bootstrap import Bootstrap
from flask_sqlalchemy import SQLAlchemy

app = Flask(__name__)
app.config['SQLALCHEMY_DATABASE_URI'] = 'sqlite:///all_books.db'
Bootstrap(app)
db = SQLAlchemy(app)

class Book(db.Model):
    id = db.Column(db.Integer, primary_key=True)
    title = db.Column(db.String(250), unique=True, nullable=False)
    author = db.Column(db.String(250), nullable=False)
    rating = db.Column(db.Float, nullable=False)

    def to_dict(self):
        return {
            "id": self.id,
            "title": self.title,
            "author": self.author,
            "rating": self.rating
        }

with app.app_context():
    db.create_all()

@app.route('/', methods=['POST', 'GET'])
def home(): 
    all_books = db.session.execute(db.select(Book)).scalars().all()
    return render_template('index.html', books=all_books)

@app.route("/add", methods=['POST', 'GET'])
def add(): 
    if request.method == 'POST':
        title = request.form["title"]
        author = request.form["author"]
        rating = request.form["rating"]
        newBook = Book(title=title, author=author, rating=rating)
        db.session.add(newBook)
        db.session.commit()
        return redirect(url_for('home'))
    return render_template('add.html')

@app.route('/editBook', methods=['POST', 'GET'])
def editBook(): 
    if request.method == 'POST':
        newRating = request.form['newRating']
        bookId = request.form['BookId']
        BookToEdit = db.session.get(Book, bookId)
        if BookToEdit:
            BookToEdit.rating = newRating
            db.session.commit()
        return redirect(url_for('home'))
    bookID = request.args.get('id')
    requestedBook = db.session.get(Book, bookID)
    return render_template('editBook.html', requestedBook=requestedBook)

@app.route('/delete')
def delete(): 
    bookId = request.args.get('id')
    bookToDelete = db.session.get(Book, bookId)
    if bookToDelete:
        db.session.delete(bookToDelete)
        db.session.commit()
    return redirect(url_for('home'))


# REST API 
@app.route('/api/books', methods=['GET'])
def get_books():
    books = db.session.execute(db.select(Book)).scalars().all()
    return jsonify([b.to_dict() for b in books]), 200

@app.route('/api/books/<int:book_id>', methods=['GET'])
def get_book(book_id):
    book = db.session.get(Book, book_id)
    if not book:
        return jsonify({"error": "Book not found"}), 404
    return jsonify(book.to_dict()), 200

@app.route('/api/books', methods=['POST'])
def create_book():
    data = request.get_json()

    if not data or not data.get("title") or not data.get("author") or data.get("rating") is None:
        return jsonify({"error": "Missing required fields"}), 400

    existing_book = db.session.execute(db.select(Book).where(Book.title == data["title"])).scalar()
    if existing_book:
        return jsonify({"error": "A book with this title already exists"}), 400

    book = Book(title=data["title"], author=data["author"], rating=float(data["rating"]))
    db.session.add(book)
    db.session.commit()
    return jsonify(book.to_dict()), 201


@app.route('/api/books/<int:book_id>', methods=['PUT'])
def update_book(book_id):
    book = db.session.get(Book, book_id)
    if not book:
        return jsonify({"error": "Book not found"}), 404

    data = request.get_json()
    if 'title' in data:
        conflict = db.session.execute(db.select(Book).where(Book.title == data['title'], Book.id != book_id)).scalar()
        if conflict:
            return jsonify({"error": "Another book already has this title"}), 400
        book.title = data["title"]

    book.author = data.get("author", book.author)
    if "rating" in data:
        book.rating = float(data["rating"])

    db.session.commit()
    return jsonify(book.to_dict()), 200


@app.route('/api/books/<int:book_id>', methods=['DELETE'])
def delete_book(book_id):
    book = db.session.get(Book, book_id)
    if not book:
        return jsonify({"error": "Book not found"}), 404

    db.session.delete(book)
    db.session.commit()
    return jsonify({"message": "Deleted"}), 200

if __name__ == "__main__": 
    app.run(debug=True)